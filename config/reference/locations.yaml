# Indian cities used for parties and routes. Validated on load by coldchain.config.
# Coordinates are approximate city centres (decimal degrees, 2 dp) from general geographic
# knowledge; no external dataset is used. is_hub: hosts warehouses / cross-docks.
# is_manufacturing_cluster: hosts pharma suppliers. Every city can host receivers.
locations:
