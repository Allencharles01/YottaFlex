# YottaFlex pipeline configuration. Validated on load by coldchain.config.
seed: 20261022
scales:
  starter: { shipments: 50,   devices: 20 }
  full:    { shipments: 5000, devices: 1000 }
reading_interval_min: 10
date_window: { start: "2026-01-01", end: "2026-10-31" }
trip_duration_hours: { min: 4, max: 72 }
scenario_weights: { NORMAL: 0.80, MINOR_SPIKE_WITHIN_ALLOWANCE: 0.06, BOUNDARY: 0.03,
                    EXCURSION_BREACH: 0.05, LONG_DWELL: 0.04, CALIBRATION_EXPIRED: 0.02 }
injection_rates: { logger_not_assigned: 0.01, product_threshold_mismatch: 0.01,
                   missing_data_silently_passed: 0.01, custody_gap_not_flagged: 0.01,
                   excursion_across_unrelated_shipments: 0.01 }
long_dwell_threshold_min: 120

# Master-data generation (Phase 2). Ranges are inclusive. Validated on load by coldchain.config.
generation:
  # Number of parties per party_type (the brief's actors, represented as data).
  parties: { SUPPLIER: 6, CARRIER: 4, WAREHOUSE: 6, RECEIVER: 15, PLANNER: 3,
             LOGISTICS_ANALYST: 2, OPERATIONS_MANAGER: 2 }
  # Display label in generated party names: "<city> <label> <nn>".
  party_name_labels: { SUPPLIER: Pharma, CARRIER: Cold Logistics, WAREHOUSE: Cold Store,
                       RECEIVER: Hospital, PLANNER: Planning Desk, LOGISTICS_ANALYST: QA Desk,
                       OPERATIONS_MANAGER: Operations Office }
  party_active_lead_days: { min: 30, max: 720 }   # active_from = date_window.start - this
  lots:
    min_per_product: 6
    shipments_per_lot: 3            # lots per product = max(min, ceil(shipment-lots / products / this))
    manufacture_lead_days: 90       # first possible manufacture date = date_window.start - this
    on_hold_rate: 0.05
    utilisation: { min: 0.5, max: 0.95 }   # share of a lot's units that its shipments take
  lots_per_shipment: { min: 1, max: 3 }
  devices:
    models: [TL-400, TL-500, CX-20]
    uncertainty_c: { min: 0.2, max: 0.5 }
    calibration_validity_days: 365
    calibrated_before_window_days: { min: 0, max: 240 }   # calibrated_on = date_window.start - this
    turnaround_min: 60              # minimum idle time between two assignments of one device
  routes:
    intermediate_stops: { min: 0, max: 3 }
    cross_dock_share: 0.4           # share of intermediate stops that are CROSS_DOCK (else WAREHOUSE)
    hub_detour_jitter: 0.5          # hubs are ranked by detour x U(1 - this, 1 + this)
    dwell_min: { min: 20, max: 120 }
    planned_dwell_min: 60
    road_factor: 1.3                # road distance = great-circle distance x this
    average_speed_kmh: 50
    drive_time_factor: { min: 0.95, max: 1.15 }   # actual / planned drive time
  departure_delay_min: { min: -20, max: 120 }     # actual - planned departure
  logger_lead_min: { min: 10, max: 60 }           # logger assigned this long before departure
  logger_tail_min: { min: 10, max: 60 }           # logger unassigned this long after arrival
